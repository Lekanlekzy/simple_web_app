name: Application CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions: {}

# concurrency:
#   group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'closed' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
#   cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  ci:
    if: >-
      ${{ github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]'
              && (github.event.action != 'closed' || github.event.pull_request.merged == true)) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
      packages: write
    uses: Lekanlekzy/stage1-devsecops/.github/workflows/reusable-app-ci.yml@main
    with:
      language: node
      node_version: '24'
      node_typescript: false
      sonar_project_key: Lekanlekzy_simple_web_app
      run_container_checks: false
      publish_image: false
      package_app: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: ci
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == github.event.repository.default_branch
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && github.sha == github.event.pull_request.merge_commit_sha
          && github.event.repository.fork != true }}
    permissions:
      id-token: write
    uses: Lekanlekzy/stage1-devsecops/.github/workflows/reusable-app-cd.yml@main
    with:
      app_package_artifact_id: ${{ needs.ci.outputs.app_package_artifact_id }}
      app_package_sha256: ${{ needs.ci.outputs.app_package_sha256 }}
      app_revision: ${{ needs.ci.outputs.app_revision }}
      azure_webapp_name: Lekan-web
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      health_check_path: /healthz
