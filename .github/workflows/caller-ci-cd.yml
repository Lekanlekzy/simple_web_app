name: Application CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions: {}

# concurrency:
#   group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'closed' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
#   cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  repository-info:
    name: Repository information
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Print repository and workflow metadata
        shell: node {0}
        env:
          REPOSITORY_JSON: ${{ toJSON(github.event.repository) }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          const { appendFileSync } = require('node:fs');

          const repository = JSON.parse(process.env.REPOSITORY_JSON);
          const isOrganization = repository.owner?.type === 'Organization';
          const info = {
            owner_name: process.env.GITHUB_REPOSITORY_OWNER,
            owner_id: process.env.GITHUB_REPOSITORY_OWNER_ID,
            owner_type: repository.owner?.type ?? 'unknown',
            repository_name: repository.name,
            repository_id: process.env.GITHUB_REPOSITORY_ID,
            repository_full_name: process.env.GITHUB_REPOSITORY,
            repository_url: repository.html_url,
            visibility: repository.visibility ?? (repository.private ? 'private' : 'public'),
            default_branch: repository.default_branch,
            is_fork: repository.fork,
            event_name: process.env.GITHUB_EVENT_NAME,
            event_action: process.env.EVENT_ACTION || null,
            ref: process.env.GITHUB_REF,
            head_ref: process.env.GITHUB_HEAD_REF || null,
            base_ref: process.env.GITHUB_BASE_REF || null,
            commit_sha: process.env.GITHUB_SHA,
            actor: process.env.GITHUB_ACTOR,
            actor_id: process.env.GITHUB_ACTOR_ID,
            workflow_ref: process.env.GITHUB_WORKFLOW_REF,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };

          const report = JSON.stringify(info, null, 2);
          console.log(report);
          console.log('::group::Complete repository metadata from the triggering event');
          console.log(JSON.stringify(repository, null, 2));
          console.log('::endgroup::');
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `### Repository information\n\n\`\`\`json\n${report}\n\`\`\`\n`,
          );

  ci:
    if: >-
      ${{ github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.actor != 'dependabot[bot]'
              && (github.event.action != 'closed' || github.event.pull_request.merged == true)) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
      packages: write
    uses: Lekanlekzy/stage1-devsecops/.github/workflows/reusable-app-ci.yml@main
    with:
      language: node
      node_version: '24'
      node_typescript: false
      sonar_project_key: Lekanlekzy_simple_web_app
      run_container_checks: false
      publish_image: false
      package_app: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: ci
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.action == 'closed'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == github.event.repository.default_branch
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && github.sha == github.event.pull_request.merge_commit_sha
          && github.event.repository.fork != true }}
    permissions:
      id-token: write
    uses: Lekanlekzy/stage1-devsecops/.github/workflows/reusable-app-cd.yml@main
    with:
      app_package_artifact_id: ${{ needs.ci.outputs.app_package_artifact_id }}
      app_package_sha256: ${{ needs.ci.outputs.app_package_sha256 }}
      app_revision: ${{ needs.ci.outputs.app_revision }}
      azure_webapp_name: Lekan-web
      azure_client_id: ${{ vars.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      health_check_path: /healthz
